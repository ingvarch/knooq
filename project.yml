name: Knooq

options:
  bundleIdPrefix: app.knooq.ios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: KT9486C6K8
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:

  KnooqKit:
    type: framework
    platform: iOS
    sources:
      - KnooqKit/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.knooq.ios.kit
    scheme:
      testTargets:
        - KnooqKitTests
      gatherCoverageData: true

  Knooq:
    type: application
    platform: iOS
    sources:
      - Knooq
    dependencies:
      - target: KnooqKit
        embed: true
      - target: KnooqShare
    entitlements:
      path: Knooq/Knooq.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.knooq.ios
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.knooq.ios
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: Knooq/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.knooq.ios.nudge-check
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.knooq.ios
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - KnooqTests
      gatherCoverageData: true

  KnooqShare:
    type: app-extension
    platform: iOS
    sources:
      - KnooqShare
    dependencies:
      - target: KnooqKit
        embed: false
    entitlements:
      path: KnooqShare/KnooqShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.knooq.ios
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.knooq.ios
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: KnooqShare/Info.plist
      properties:
        CFBundleDisplayName: Knooq
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.knooq.ios.share
        TARGETED_DEVICE_FAMILY: "1"

  KnooqKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KnooqKitTests
    dependencies:
      - target: KnooqKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.knooq.ios.kit.tests

  KnooqTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KnooqTests
    dependencies:
      - target: Knooq
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.knooq.ios.tests
